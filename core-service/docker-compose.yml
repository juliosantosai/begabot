version: '3.8'

services:
  redis:
    image: redis:7
    container_name: redis-cache
    restart: always
    ports:
      - "6380:6379"

  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: begabot_user
      POSTGRES_PASSWORD: tu_password_seguro_aqui
      POSTGRES_DB: begabot_saas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

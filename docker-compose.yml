services:
  postgres:
    image: postgres:15-alpine
    container_name: begabot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-begabot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tu_password_seguro_aqui}
      POSTGRES_DB: ${POSTGRES_DB:-begabot_saas}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-begabot_user} -d ${POSTGRES_DB:-begabot_saas}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: begabot-redis
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  gateway-service:
    build:
      context: .
      dockerfile: ./gateway-service/Dockerfile
    container_name: begabot-webhook
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${GATEWAY_PORT:-3001}
      HOST: ${HOST:-0.0.0.0}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MESSAGE_BUFFER_MS: ${MESSAGE_BUFFER_MS:-250}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-dev-key}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-dev-token}
    depends_on:
      redis:
        condition: service_healthy

  buffer-service:
    build:
      context: .
      dockerfile: ./buffer-service/Dockerfile
    container_name: begabot-buffer
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BUFFER_PORT:-3002}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MESSAGE_BUFFER_MS: ${MESSAGE_BUFFER_MS:-250}
    depends_on:
      redis:
        condition: service_healthy

  core-service:
    build:
      context: .
      dockerfile: ./core-service/Dockerfile
    container_name: begabot-pg
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${CORE_PORT:-3003}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-begabot_user}:${POSTGRES_PASSWORD:-tu_password_seguro_aqui}@postgres:5432/${POSTGRES_DB:-begabot_saas}}
    depends_on:
      postgres:
        condition: service_healthy

  ai-agent-service:
    build:
      context: .
      dockerfile: ./ai-agent-service/Dockerfile
    container_name: begabot-aiagent
    ports:
      - "3008:3008"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${AI_PORT:-3008}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-demo-key}
    depends_on:
      redis:
        condition: service_healthy

  media-switcher-service:
    build:
      context: .
      dockerfile: ./media-switcher-service/Dockerfile
    container_name: begabot-media-switcher
    ports:
      - "3004:3004"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${MEDIA_SWITCHER_PORT:-3004}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-demo-key}
    depends_on:
      redis:
        condition: service_healthy

  audit-metrics-service:
    build:
      context: .
      dockerfile: ./audit-metrics-service/Dockerfile
    container_name: begabot-audit-metrics
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${AUDIT_METRICS_PORT:-3005}
    depends_on:
      redis:
        condition: service_healthy

  scheduler-service:
    build:
      context: .
      dockerfile: ./scheduler-service/Dockerfile
    container_name: begabot-scheduler
    ports:
      - "3006:3006"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${SCHEDULER_PORT:-3006}
    restart: unless-stopped
    depends_on:
      - core-service

  dispatcher-service:
    build:
      context: .
      dockerfile: ./dispatcher-service/Dockerfile
    container_name: begabot-dispatcher
    ports:
      - "3007:3007"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${DISPATCHER_PORT:-3007}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:

services:
  postgres:
    image: postgres:15-alpine
    container_name: begabot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-begabot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tu_password_seguro_aqui}
      POSTGRES_DB: ${POSTGRES_DB:-begabot_saas}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-begabot_user} -d ${POSTGRES_DB:-begabot_saas}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: begabot-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: begabot-webhook
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${GATEWAY_PORT:-3001}
      HOST: ${HOST:-0.0.0.0}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MESSAGE_BUFFER_MS: ${MESSAGE_BUFFER_MS:-250}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-dev-key}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-dev-token}
    depends_on:
      redis:
        condition: service_healthy

  buffer-service:
    build:
      context: ./buffer-service
      dockerfile: Dockerfile
    container_name: begabot-buffer
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BUFFER_PORT:-3000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MESSAGE_BUFFER_MS: ${MESSAGE_BUFFER_MS:-250}
    depends_on:
      redis:
        condition: service_healthy

  core-service:
    build:
      context: ./core-service
      dockerfile: Dockerfile
    container_name: begabot-pg
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${CORE_PORT:-3002}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-begabot_user}:${POSTGRES_PASSWORD:-tu_password_seguro_aqui}@postgres:5432/${POSTGRES_DB:-begabot_saas}}
    depends_on:
      postgres:
        condition: service_healthy

  ai-agent-service:
    build:
      context: ./ai-agent-service
      dockerfile: Dockerfile
    container_name: begabot-aiagent
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${AI_PORT:-3003}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-demo-key}
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:

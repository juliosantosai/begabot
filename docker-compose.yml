services:
  postgres:
    image: postgres:15-alpine
    container_name: begabot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-begabot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tu_password_seguro_aqui}
      POSTGRES_DB: ${POSTGRES_DB:-begabot_saas}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-begabot_user} -d ${POSTGRES_DB:-begabot_saas}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: begabot-redis
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  servicio-buffer:
    build:
      context: .
      dockerfile: ./servicio-buffer/Dockerfile
    container_name: begabot-buffer
    ports:
      - "3001:3001"
    env_file:
      - ./servicio-buffer/.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BUFFER_PORT:-3001}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      redis:
        condition: service_healthy

  servicio-core:
    build:
      context: .
      dockerfile: ./servicio-core/Dockerfile
    container_name: begabot-pg
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${CORE_PORT:-3002}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-begabot_user}:${POSTGRES_PASSWORD:-tu_password_seguro_aqui}@postgres:5432/${POSTGRES_DB:-begabot_saas}}
    command: sh -c "npx prisma migrate deploy && node index.js"
    depends_on:
      postgres:
        condition: service_healthy

  servicio-agente-ia:
    build:
      context: .
      dockerfile: ./servicio-agente-ia/Dockerfile
    container_name: begabot-aiagent
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${AI_PORT:-3003}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
     
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
